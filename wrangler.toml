name = "uranus-companion"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "COMPANION"
class_name = "Companion"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Companion"]

[vars]
TZ = "America/New_York"

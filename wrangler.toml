name = "rl7-uranus-companion"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "COMPANION"
class_name = "Companion"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Companion"]

# 兜底：Durable Object 的闹钟链万一断了（以前遇到过不自动整理），每 30 分钟叫醒一次接上。免费，不调模型。
[triggers]
crons = ["*/30 * * * *"]

[vars]
TZ = "America/New_York"
